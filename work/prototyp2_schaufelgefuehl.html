<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Buddeln – Prototyp 2: Schaufelgefühl</title>
<style>
  html,body{margin:0;background:#1a1410;color:#d9cdb8;font:14px/1.4 Georgia,serif;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;height:100vh}
  canvas{image-rendering:pixelated;background:#0e0b08;max-width:100vw}
  #hud{width:1040px;max-width:100vw;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:8px 12px}
  label{display:flex;gap:6px;align-items:center;white-space:nowrap}
  label b{color:#f0e2c4;font-weight:normal;min-width:2.5em;text-align:right}
  input[type=range]{width:110px;accent-color:#c9a25a}
  .dim{color:#8a7d68}
  button{background:#3a2e22;color:#f0e2c4;border:1px solid #6b5843;font:inherit;padding:2px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="1040" height="560"></canvas>
<div id="hud">
  <span class="dim">A/D gehen · Maus zielen · linke Taste halten: schaufeln</span>
  <label>Reichweite <input type="range" id="reach" min="6" max="20" value="12"><b>12</b></label>
  <label>Kegel <input type="range" id="arc" min="15" max="80" value="40"><b>40</b>°</label>
  <label>Takt <input type="range" id="beat" min="8" max="40" value="20"><b>20</b> Fr.</label>
  <label>Ausholen <input type="range" id="wind" min="0" max="15" value="6"><b>6</b> Fr.</label>
  <label>Hitstop <input type="range" id="stop" min="0" max="8" value="2"><b>2</b> Fr.</label>
  <label>Wackeln <input type="range" id="shk" min="0" max="10" value="3"><b>3</b></label>
  <label>Wurfweite <input type="range" id="thr" min="1" max="10" value="5"><b>5</b></label>
  <label>Bröckeln <input type="range" id="crm" min="1" max="10" value="4"><b>4</b></label>
  <button id="reset">Erde zurücksetzen</button>
</div>
</div>
<script>
const CS=4, W=260, H=140;
const EMPTY=0, LOOSE=1, PACKED=2, STONE=3;
const grid=new Uint8Array(W*H), shade=new Uint8Array(W*H);
const idx=(x,y)=>y*W+x, inB=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
const FLOOR=H-4;
let seed=3; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
function buildWorld(){
  grid.fill(EMPTY);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    shade[idx(x,y)]=(rnd()*40)|0;
    if(y>=FLOOR||x<1||x>=W-1||y<1){ grid[idx(x,y)]=STONE; continue; }
    // Erdhaufen rechts: ab x=120 ansteigend, dann voll
    const top = x<120? H : x<175? FLOOR-(x-120)*2.0 : 26;
    if(y>=top) grid[idx(x,y)]=PACKED;
  }
}
buildWorld();

// Einstellungen
const P={};
for(const id of ['reach','arc','beat','wind','stop','shk','thr','crm']){
  const el=document.getElementById(id); const out=el.nextElementSibling;
  const upd=()=>{P[id]=+el.value; out.textContent=el.value;}; el.oninput=upd; upd();
}
document.getElementById('reset').onclick=()=>{buildWorld();parts.length=0;};

// Roboter: 12 x 24 Zellen, steht auf dem Boden, links
const bot={x:40, y:FLOOR-24, w:12, h:24, face:1};
const keys={}; const mouse={x:0,y:0,down:false};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*cv.width/r.width;mouse.y=(e.clientY-r.top)*cv.height/r.height;});
cv.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true;});
addEventListener('mouseup',()=>mouse.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
const inBot=(x,y)=>x>=bot.x&&x<bot.x+bot.w&&y>=bot.y&&y<bot.y+bot.h;
const free=(x,y)=>inB(x,y)&&grid[idx(x,y)]===EMPTY&&!inBot(x,y);

// ---------------- Physik
let frame=0;
function physics(){
  const dir=(frame&1)?1:-1;
  const crumble=[0.15,0.05,0.012,0.003,0.0008].map(p=>p*P.crm/4);
  for(let y=H-2;y>=1;y--)for(let i=0;i<W;i++){
    const x=dir>0?i:W-1-i, k=idx(x,y), t=grid[k];
    if(t===LOOSE){
      if(free(x,y+1)){grid[idx(x,y+1)]=LOOSE;grid[k]=EMPTY;continue;}
      const a=x+dir,b=x-dir;
      if(free(a,y+1)&&free(a,y)){grid[idx(a,y+1)]=LOOSE;grid[k]=EMPTY;}
      else if(free(b,y+1)&&free(b,y)){grid[idx(b,y+1)]=LOOSE;grid[k]=EMPTY;}
    }else if(t===PACKED){
      if(grid[idx(x,y+1)]===EMPTY){
        let n=0; for(const [dx,dy] of [[-1,0],[1,0],[-1,1],[1,1]]) if(grid[idx(x+dx,y+dy)]!==EMPTY) n++;
        if(Math.random()<crumble[n]) grid[k]=LOOSE;
      }
    }
  }
}

// ---------------- Schaufel
// Zustand: Takt zählt hoch; bei Takt==Ausholen schlägt sie zu. Armwinkel läuft von "hinten" nach "vorn".
let beat=-1, hitstop=0, shake=0, swingPhase=0; // swingPhase: -1 (ausgeholt) .. 1 (durchgeschlagen)
const parts=[];   // fliegende Erde, wird beim Landen wieder zu loser Erde
function hand(){ return {x:(bot.x+bot.w/2)*CS + bot.face*bot.w*CS*0.35, y:(bot.y+bot.h*0.55)*CS}; }
function aim(){ const h=hand(); return Math.atan2(mouse.y-h.y, mouse.x-h.x); }
function strike(){
  const h=hand(), ang=aim(), R=P.reach, ARC=P.arc*Math.PI/180;
  const hx=h.x/CS, hy=h.y/CS; let got=0;
  for(let y=Math.floor(hy-R);y<=hy+R;y++)for(let x=Math.floor(hx-R);x<=hx+R;x++){
    if(!inB(x,y)) continue;
    const dx=x-hx, dy=y-hy, d=Math.hypot(dx,dy); if(d>R||d<1) continue;
    let da=Math.atan2(dy,dx)-ang; da=Math.atan2(Math.sin(da),Math.cos(da)); if(Math.abs(da)>ARC/2) continue;
    const k=idx(x,y), t=grid[k]; if(t!==LOOSE&&t!==PACKED) continue;
    grid[k]=EMPTY; got++;
    // über die Schulter nach hinten werfen
    const back=Math.PI+ang*0.0; const sp=1.2+P.thr*0.5;
    parts.push({x:x*CS,y:y*CS,vx:-bot.face*(sp*0.6+Math.random()*sp*0.6),vy:-(sp*0.7+Math.random()*sp*0.5),s:shade[k]});
  }
  if(got>0){ hitstop=P.stop; shake=Math.min(8,got/8)*P.shk/3; }
}
function updateShovel(){
  if(!mouse.down){ beat=-1; swingPhase*=0.85; return; }
  beat++;
  const cycle=Math.max(P.beat, P.wind+4);
  const t=beat%cycle;
  if(t<P.wind){ swingPhase=-(t+1)/P.wind; }          // ausholen: Arm wandert nach hinten
  else if(t===P.wind){ swingPhase=1; strike(); }      // Schlag
  else { swingPhase*=0.8; }                           // zurück in Ruhe
  bot.face = Math.cos(aim())>=0?1:-1;
}

function updateBot(){
  let dx=0; if(keys.a)dx=-1; if(keys.d)dx=1;
  if(dx&&frame%2===0){
    let ok=true; for(let j=0;j<bot.h;j++){ const t=grid[idx(bot.x+(dx>0?bot.w:-1),bot.y+j)]; if(t===PACKED||t===STONE){ok=false;break;} }
    if(ok){ bot.x+=dx; for(let j=0;j<bot.h;j++) grid[idx(bot.x+(dx>0?bot.w-1:0),bot.y+j)]=EMPTY; /* schiebt sich durch lose Erde */ }
  }
}
function updateParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.22;
    const cx=Math.floor(p.x/CS), cy=Math.floor(p.y/CS);
    if(!inB(cx,cy)||cx<1){parts.splice(i,1);continue;}
    if(grid[idx(cx,cy)]!==EMPTY||inBot(cx,cy)||p.vy>0&&!free(cx,cy+1)){
      // landen: erste freie Zelle nach oben suchen
      let yy=cy; while(yy>0&&!free(cx,yy)) yy--;
      if(free(cx,yy)){grid[idx(cx,yy)]=LOOSE; shade[idx(cx,yy)]=p.s;}
      parts.splice(i,1);
    }
  }
}

// ---------------- Zeichnen
function drawWorld(){
  const img=ctx.createImageData(cv.width,cv.height), d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=idx(x,y), t=grid[k]; if(t===EMPTY) continue; const s=shade[k]; let r,g,b;
    if(t===PACKED){r=92+s*.6;g=64+s*.5;b=40+s*.3;} else if(t===LOOSE){r=125+s*.7;g=92+s*.6;b=58+s*.4;} else {r=62+s*.4;g=62+s*.4;b=64+s*.4;}
    for(let j=0;j<CS;j++)for(let i=0;i<CS;i++){const p=((y*CS+j)*cv.width+(x*CS+i))*4;d[p]=r;d[p+1]=g;d[p+2]=b;d[p+3]=255;}
  }
  ctx.putImageData(img,0,0);
}
function drawBot(){
  const px=bot.x*CS, py=bot.y*CS, w=bot.w*CS, h=bot.h*CS, f=bot.face;
  // Beine
  ctx.fillStyle='#8f877a'; ctx.fillRect(px+6,py+h-22,10,22); ctx.fillRect(px+w-16,py+h-22,10,22);
  // Rumpf
  ctx.fillStyle='#c9c2b4'; ctx.fillRect(px,py+18,w,h-40);
  ctx.fillStyle='#b3ab9c'; ctx.fillRect(px+4,py+24,w-8,6);
  // Kopf
  ctx.fillStyle='#a39c8e'; ctx.fillRect(px+8,py,w-16,18);
  ctx.fillStyle='#6fb4e0'; ctx.fillRect(px+(f>0?w-16:10),py+5,6,6);
  // Arm + Schaufel
  const hd=hand(), a=aim();
  const swing=swingPhase*0.9;                 // -0.9 (ausgeholt) .. +0.9 (durch)
  const armAng=a - f*swing*0.6;
  const L=P.reach*CS*0.85;
  const ex=hd.x+Math.cos(armAng)*L*0.5, ey=hd.y+Math.sin(armAng)*L*0.5;
  const sx=hd.x+Math.cos(armAng)*L, sy=hd.y+Math.sin(armAng)*L;
  ctx.strokeStyle='#8a8378'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(hd.x,hd.y); ctx.lineTo(ex,ey); ctx.lineTo(sx,sy); ctx.stroke();
  // Schaufelblatt quer zum Stiel
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(armAng); ctx.fillStyle='#d9d3c6'; ctx.fillRect(-2,-9,10,18); ctx.restore();
  // Zielkegel
  if(!mouse.down){ ctx.strokeStyle='rgba(255,240,200,.15)'; ctx.lineWidth=1; const A=P.arc*Math.PI/360;
    ctx.beginPath(); ctx.moveTo(hd.x,hd.y); ctx.arc(hd.x,hd.y,P.reach*CS,a-A,a+A); ctx.closePath(); ctx.stroke(); }
}
function loop(){
  frame++;
  if(hitstop>0) hitstop--; else { physics(); updateBot(); updateShovel(); }
  updateParts();
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2); shake*=0.82; if(shake<.2)shake=0;}
  ctx.clearRect(-12,-12,cv.width+24,cv.height+24);
  drawWorld(); drawBot();
  for(const p of parts){ ctx.fillStyle=`rgb(${125+p.s*.7|0},${92+p.s*.6|0},${58+p.s*.4|0})`; ctx.fillRect(p.x,p.y,CS,CS); }
  ctx.restore();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
