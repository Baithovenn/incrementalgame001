<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Buddeln – Prototyp 3: Baggerarm</title>
<style>
  html,body{margin:0;background:#1a1410;color:#d9cdb8;font:14px/1.4 Georgia,serif;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;height:100vh}
  canvas{image-rendering:pixelated;background:#0e0b08;max-width:100vw}
  #hud{width:1040px;max-width:100vw;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:8px 12px}
  label{display:flex;gap:6px;align-items:center;white-space:nowrap}
  label b{color:#f0e2c4;font-weight:normal;min-width:2.5em;text-align:right}
  input[type=range]{width:110px;accent-color:#c9a25a}
  .dim{color:#8a7d68}
  button{background:#3a2e22;color:#f0e2c4;border:1px solid #6b5843;font:inherit;padding:2px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="1040" height="560"></canvas>
<div id="hud">
  <span class="dim">Maus: Ziel in der Öffnung (Tiefe und Höhe) · linke Taste: ein Hub, halten: fortlaufend</span>
  <label>Vorschub <input type="range" id="feed" min="2" max="12" value="6"><b>6</b></label>
  <label>Tiefe max <input type="range" id="depth" min="10" max="50" value="30"><b>30</b> Z.</label>
  <label>Curl <input type="range" id="curl" min="20" max="100" value="60"><b>60</b>°</label>
  <label>Curl-Dauer <input type="range" id="curlT" min="6" max="40" value="16"><b>16</b> Fr.</label>
  <label>Lockern <input type="range" id="halo" min="0" max="6" value="3"><b>3</b> Z.</label>
  <label>Hitstop <input type="range" id="stop" min="0" max="8" value="3"><b>3</b> Fr.</label>
  <label>Wackeln <input type="range" id="shk" min="0" max="10" value="3"><b>3</b></label>
  <label>Bröckeln <input type="range" id="crm" min="1" max="10" value="5"><b>5</b></label>
  <button id="reset">Erde zurücksetzen</button>
</div>
</div>
<script>
const CS=4, W=260, H=140;
const EMPTY=0, LOOSE=1, PACKED=2, STONE=3;
const grid=new Uint8Array(W*H), shade=new Uint8Array(W*H);
const idx=(x,y)=>y*W+x, inB=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
const FLOOR=H-4;
const WALLX=150, GAP=25;               // Absperrung bei x=150, Öffnung unten 25 Zellen = 100 px
let seed=3; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
function buildWorld(){
  grid.fill(EMPTY);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    shade[idx(x,y)]=(rnd()*40)|0;
    if(y>=FLOOR||x<1||x>=W-1||y<1){grid[idx(x,y)]=STONE;continue;}
    if((x===WALLX||x===WALLX+1)&&y<FLOOR-GAP){grid[idx(x,y)]=STONE;continue;}
    if(x>WALLX+1&&y>=14) grid[idx(x,y)]=PACKED;
  }
}
buildWorld();

const P={};
for(const id of ['feed','depth','curl','curlT','halo','stop','shk','crm']){
  const el=document.getElementById(id), out=el.nextElementSibling;
  const upd=()=>{P[id]=+el.value;out.textContent=el.value;}; el.oninput=upd; upd();
}
document.getElementById('reset').onclick=()=>{buildWorld();parts.length=0;arm.state='rest';arm.load=0;};

// ---------------- Roboter und Arm
const bot={x:88,y:FLOOR-24,w:12,h:24};
const shoulder=()=>({x:(bot.x+bot.w)*CS-6, y:(bot.y+6)*CS});
const BW=6, BH=7;                       // Schaufel: 6 breit (x), 7 hoch (y), in Zellen
// Position der Schaufel: hinteres unteres Eck (Drehpunkt) in Zellen, plus Winkel
const arm={state:'rest', px:bot.x+bot.w+6, py:FLOOR-GAP/2-BH/2, ang:0, t:0, load:0, tx:0, ty:0, contact:false};
const REST={x:bot.x+bot.w+6, y:FLOOR-GAP/2-BH/2};
const mouse={x:0,y:0,down:false};
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*cv.width/r.width/CS;mouse.y=(e.clientY-r.top)*cv.height/r.height/CS;});
cv.addEventListener('mousedown',e=>{if(e.button===0){mouse.down=true;if(arm.state==='rest')startCycle();}});
addEventListener('mouseup',()=>mouse.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());

// Zellen, die die Schaufel gerade belegt (gedrehtes Rechteck um den Drehpunkt)
function bucketCells(px,py,ang){
  const out=[]; const c=Math.cos(-ang), s=Math.sin(-ang);
  for(let j=0;j<BH;j++)for(let i=0;i<BW;i++){
    // lokale Koordinaten: i nach vorn, j nach oben vom Drehpunkt
    const lx=i+0.5, ly=-(j+0.5);
    const x=Math.round(px+lx*c-ly*s-0.5), y=Math.round(py+lx*s+ly*c-0.5);
    if(inB(x,y)) out.push(idx(x,y));
  }
  return out;
}
let occupied=new Set();
const free=(x,y)=>inB(x,y)&&grid[idx(x,y)]===EMPTY&&!occupied.has(idx(x,y));

function startCycle(){
  arm.tx=Math.max(WALLX+4, Math.min(WALLX+P.depth, mouse.x));
  arm.ty=Math.max(FLOOR-GAP, Math.min(FLOOR-BH, mouse.y-BH/2));
  arm.state='extend'; arm.ang=0; arm.t=0; arm.contact=false;
}
let hitstop=0, shake=0;
const parts=[];
function displace(k){ // Zelle wird von der Schaufel verdrängt: nach oben in die nächste freie Zelle
  const x=k%W; let y=(k/W)|0; const s=shade[k]; grid[k]=EMPTY;
  for(let yy=y-1;yy>0;yy--){ if(free(x,yy)){grid[idx(x,yy)]=LOOSE;shade[idx(x,yy)]=s;return;} }
}
function loosenHalo(cells){
  const r=P.halo; if(r===0) return;
  for(const k of cells){ const x=k%W, y=(k/W)|0;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){ if(dx*dx+dy*dy>r*r) continue; const xx=x+dx,yy=y+dy;
      if(inB(xx,yy)&&grid[idx(xx,yy)]===PACKED&&Math.random()<0.35) grid[idx(xx,yy)]=LOOSE; }
  }
}
function moveBucketTo(nx,ny,nang,scooping){
  const cells=bucketCells(nx,ny,nang); let hit=0;
  for(const k of cells){ const t=grid[k]; if(t===PACKED||t===LOOSE){ hit++; if(scooping){grid[k]=EMPTY;arm.load++;} else displace(k); } }
  if(hit>0){ if(!arm.contact){arm.contact=true;hitstop=P.stop;shake=P.shk;} loosenHalo(cells.filter(k=>{const x=k%W;return x>=Math.round(nx)+BW-2;})); }
  arm.px=nx; arm.py=ny; arm.ang=nang; occupied=new Set(cells);
}
function updateArm(){
  const sp=P.feed/4;
  if(arm.state==='rest'){ occupied=new Set(bucketCells(arm.px,arm.py,0)); if(mouse.down) startCycle(); return; }
  if(arm.state==='extend'){
    const dx=arm.tx-arm.px, dy=arm.ty-arm.py, d=Math.hypot(dx,dy);
    if(d<=sp){ moveBucketTo(arm.tx,arm.ty,0,false); arm.state='curl'; arm.t=0; }
    else moveBucketTo(arm.px+dx/d*sp, arm.py+dy/d*sp, 0, false);
  } else if(arm.state==='curl'){
    arm.t++; const a=P.curl*Math.PI/180*Math.min(1,arm.t/P.curlT);
    moveBucketTo(arm.px,arm.py,a,true);
    if(arm.t>=P.curlT){ arm.state='retract'; }
  } else if(arm.state==='retract'){
    const dx=REST.x-arm.px, dy=REST.y-arm.py, d=Math.hypot(dx,dy);
    if(d<=sp*1.5){ moveBucketTo(REST.x,REST.y,arm.ang,false); arm.state='dump'; arm.t=0; }
    else moveBucketTo(arm.px+dx/d*sp*1.5, arm.py+dy/d*sp*1.5, arm.ang, false);
  } else if(arm.state==='dump'){
    arm.t++; arm.ang=Math.max(-0.9, arm.ang-0.12); occupied=new Set(bucketCells(arm.px,arm.py,arm.ang));
    if(arm.ang<-0.3&&arm.load>0){ const n=Math.min(4,arm.load); arm.load-=n;
      for(let i=0;i<n;i++) parts.push({x:(arm.px+2+Math.random()*3)*CS,y:(arm.py-2)*CS,vx:-0.5-Math.random()*1.5,vy:-0.5+Math.random(),s:(Math.random()*40)|0}); }
    if(arm.load===0&&arm.t>14){ arm.state='rest'; arm.ang=0; }
  }
}

// ---------------- Physik
let frame=0;
function physics(){
  const dir=(frame&1)?1:-1;
  const crumble=[0.15,0.05,0.012,0.003,0.0008].map(p=>p*P.crm/4);
  for(let y=H-2;y>=1;y--)for(let i=0;i<W;i++){
    const x=dir>0?i:W-1-i, k=idx(x,y), t=grid[k];
    if(t===LOOSE){
      if(free(x,y+1)){grid[idx(x,y+1)]=LOOSE;shade[idx(x,y+1)]=shade[k];grid[k]=EMPTY;continue;}
      const a=x+dir,b=x-dir;
      if(free(a,y+1)&&free(a,y)){grid[idx(a,y+1)]=LOOSE;shade[idx(a,y+1)]=shade[k];grid[k]=EMPTY;}
      else if(free(b,y+1)&&free(b,y)){grid[idx(b,y+1)]=LOOSE;shade[idx(b,y+1)]=shade[k];grid[k]=EMPTY;}
    }else if(t===PACKED){
      if(grid[idx(x,y+1)]===EMPTY&&!occupied.has(idx(x,y+1))){
        let n=0; for(const [dx,dy] of [[-1,0],[1,0],[-1,1],[1,1]]) if(grid[idx(x+dx,y+dy)]!==EMPTY) n++;
        if(Math.random()<crumble[n]) grid[k]=LOOSE;
      }
    }
  }
}
function updateParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.22;
    const cx=Math.floor(p.x/CS), cy=Math.floor(p.y/CS);
    if(!inB(cx,cy)){parts.splice(i,1);continue;}
    if(!free(cx,cy)||(p.vy>0&&!free(cx,cy+1))){
      let yy=cy; while(yy>0&&!free(cx,yy)) yy--;
      if(free(cx,yy)){grid[idx(cx,yy)]=LOOSE;shade[idx(cx,yy)]=p.s;}
      parts.splice(i,1);
    }
  }
}

// ---------------- Zeichnen
function drawWorld(){
  const img=ctx.createImageData(cv.width,cv.height), d=img.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=idx(x,y), t=grid[k]; if(t===EMPTY) continue; const s=shade[k]; let r,g,b;
    if(t===PACKED){r=92+s*.6;g=64+s*.5;b=40+s*.3;} else if(t===LOOSE){r=125+s*.7;g=92+s*.6;b=58+s*.4;} else {r=62+s*.4;g=62+s*.4;b=64+s*.4;}
    for(let j=0;j<CS;j++)for(let i=0;i<CS;i++){const p=((y*CS+j)*cv.width+(x*CS+i))*4;d[p]=r;d[p+1]=g;d[p+2]=b;d[p+3]=255;}
  }
  ctx.putImageData(img,0,0);
}
function drawArm(){
  const S=shoulder(); const pivot={x:arm.px*CS, y:arm.py*CS};
  // Zweigelenk-Arm: Schulter -> Ellbogen -> Drehpunkt der Schaufel (einfache IK, Ellbogen oben)
  const L1=150, L2=150; const dx=pivot.x-S.x, dy=pivot.y-S.y; const d=Math.min(L1+L2-1,Math.hypot(dx,dy));
  const a=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d)))); const base=Math.atan2(dy,dx);
  const E={x:S.x+Math.cos(base-a)*L1, y:S.y+Math.sin(base-a)*L1};
  ctx.strokeStyle='#8a8378'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(S.x,S.y); ctx.lineTo(E.x,E.y); ctx.lineTo(pivot.x,pivot.y); ctx.stroke();
  ctx.fillStyle='#6f6a60'; ctx.beginPath(); ctx.arc(E.x,E.y,7,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(S.x,S.y,8,0,7); ctx.fill();
  // Schaufel: U-Form, offen nach vorn-oben
  ctx.save(); ctx.translate(pivot.x,pivot.y); ctx.rotate(-arm.ang);
  ctx.fillStyle='#d9d3c6';
  ctx.fillRect(0,-BH*CS,3,BH*CS);              // Rückwand
  ctx.fillRect(0,-3,BW*CS,3);                  // Boden
  ctx.fillRect(BW*CS-3,-BH*CS*0.45,3,BH*CS*0.45); // Schneide vorn, halbhoch
  if(arm.load>0){ ctx.fillStyle='#8a6a48'; const f=Math.min(1,arm.load/(BW*BH)); ctx.fillRect(3,-3-(BH*CS-6)*f,BW*CS-6,(BH*CS-6)*f); }
  ctx.restore();
}
function drawBot(){
  const px=bot.x*CS, py=bot.y*CS, w=bot.w*CS, h=bot.h*CS;
  ctx.fillStyle='#8f877a'; ctx.fillRect(px+2,py+h-14,w-4,14);         // Raupe
  ctx.fillStyle='#5f5a52'; for(let i=0;i<w-8;i+=8) ctx.fillRect(px+4+i,py+h-12,4,10);
  ctx.fillStyle='#c9c2b4'; ctx.fillRect(px,py+18,w,h-32);             // Rumpf
  ctx.fillStyle='#a39c8e'; ctx.fillRect(px+w-30,py,26,18);            // Kabine vorn
  ctx.fillStyle='#6fb4e0'; ctx.fillRect(px+w-12,py+5,6,6);
}
function drawTarget(){
  if(arm.state!=='rest') return;
  const tx=Math.max(WALLX+4,Math.min(WALLX+P.depth,mouse.x)), ty=Math.max(FLOOR-GAP,Math.min(FLOOR-BH,mouse.y-BH/2));
  ctx.strokeStyle='rgba(255,240,200,.25)'; ctx.lineWidth=1; ctx.strokeRect(tx*CS,(ty-BH)*CS,BW*CS,BH*CS);
  ctx.setLineDash([4,6]); ctx.beginPath(); ctx.moveTo(arm.px*CS,arm.py*CS); ctx.lineTo(tx*CS,ty*CS); ctx.stroke(); ctx.setLineDash([]);
}
function loop(){
  frame++;
  if(hitstop>0) hitstop--; else { updateArm(); physics(); }
  updateParts();
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);shake*=0.82;if(shake<.2)shake=0;}
  ctx.clearRect(-12,-12,cv.width+24,cv.height+24);
  drawWorld(); drawBot(); drawArm(); drawTarget();
  for(const p of parts){ctx.fillStyle=`rgb(${125+p.s*.7|0},${92+p.s*.6|0},${58+p.s*.4|0})`;ctx.fillRect(p.x,p.y,CS,CS);}
  ctx.restore();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
