<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Klumpen – Prototyp 4</title>
<style>
  html,body{margin:0;background:#15110d;color:#d9cdb8;font:14px/1.4 Georgia,serif;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;height:100vh}
  canvas{background:#2a2219;max-width:100vw;display:block}
  #hud{width:1040px;max-width:100vw;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:8px 12px}
  label{display:flex;gap:6px;align-items:center;white-space:nowrap}
  label b,#hud b{color:#f0e2c4;font-weight:normal;min-width:2.2em;text-align:right}
  input[type=range]{width:100px;accent-color:#c9a25a}
  .dim{color:#8a7d68}
  #say{width:100%;font-style:italic;color:#a89c86;min-height:1.4em}
  button{background:#3a2e22;color:#f0e2c4;border:1px solid #6b5843;font:inherit;padding:2px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="1040" height="600"></canvas>
<div id="hud">
  <span class="dim">W/S Gas · A/D lenken · Maus: Stelle am Klumpen · linke Taste halten: arbeiten · Basis unten links: laden + abladen</span>
  <span>Akku <b id="bat">100</b></span>
  <span>Stau <b id="st">0</b><span class="dim">/</span><b id="cap">40</b></span>
  <span>Abgeliefert <b id="ore">0</b></span>
  <label>Kraft <input type="range" id="pow" min="1" max="10" value="3"><b>3</b></label>
  <label>Takt <input type="range" id="beat" min="10" max="40" value="22"><b>22</b></label>
  <label>Wucht <input type="range" id="rad" min="10" max="60" value="26"><b>26</b></label>
  <label>Hitstop <input type="range" id="stop" min="0" max="8" value="3"><b>3</b></label>
  <button id="reset">Feld neu</button>
  <span id="say"></span>
</div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d'); const CW=cv.width, CH=cv.height;
const P={}; for(const id of ['pow','beat','rad','stop']){const el=document.getElementById(id),o=el.nextElementSibling;const u=()=>{P[id]=+el.value;o.textContent=el.value;};el.oninput=u;u();}
const sayEl=document.getElementById('say'); let sayT=0; function say(s){sayEl.textContent=s;sayT=400;}
const Z=0.55;               // wie stark Höhe nach oben versetzt wird (Schrägsicht)

// ---------------- Feld
const BASE={x:110,y:CH-90,r:60};
let lumps=[], chunks=[];
function rnd(a,b){return a+Math.random()*(b-a);}
function makeLump(cx,cy,size,hard){
  const parts=[]; const n=Math.round(size*0.5+6);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, d=Math.sqrt(Math.random())*size;
    parts.push({x:cx+Math.cos(a)*d*1.15,y:cy+Math.sin(a)*d*0.85,r:rnd(13,24),bind:hard+rnd(-0.6,0.6),core:false,shade:rnd(-14,14)});
  }
  parts.push({x:cx,y:cy,r:size*0.42+8,bind:hard+6,core:true,shade:0});  // Kern: deutlich härter
  return {parts,cx,cy};
}
function buildField(){
  lumps=[];chunks=[];
  const spots=[[330,420,42,2],[560,470,50,3],[420,230,46,3.5],[700,260,58,4.5],[880,440,54,5.5]];
  for(const [x,y,s,h] of spots) lumps.push(makeLump(x,y,s,h));
}
buildField();
document.getElementById('reset').onclick=buildField;

// ---------------- Fahrzeug
const car={x:BASE.x,y:BASE.y,a:-Math.PI/2,v:0,bat:100,stash:0,cap:40,ore:0};
const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;}); addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const mouse={x:0,y:0,down:false};
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*CW/r.width;mouse.y=(e.clientY-r.top)*CH/r.height;});
cv.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true;});
addEventListener('mouseup',()=>mouse.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());

function updateCar(){
  const gas=(keys.w?1:0)-(keys.s?1:0);
  car.v+=gas*0.09; car.v*=0.955; if(Math.abs(car.v)<0.01)car.v=0;
  car.v=Math.max(-1.4,Math.min(2.4,car.v));
  const steer=(keys.d?1:0)-(keys.a?1:0);
  // auf der Stelle drehen geht, mit Fahrt lenkt es
  const turn = steer*(0.028 + Math.abs(car.v)*0.008) * (car.v<-0.2?-1:1);
  car.a+=turn;
  let nx=car.x+Math.cos(car.a)*car.v, ny=car.y+Math.sin(car.a)*car.v;
  // Klumpen versperren
  let hit=false;
  for(const L of lumps)for(const p of L.parts){ if(Math.hypot(nx-p.x,ny-p.y)<p.r+16){hit=true;break;} }
  if(hit){car.v*=-0.3;} else {car.x=nx;car.y=ny;}
  car.x=Math.max(30,Math.min(CW-30,car.x)); car.y=Math.max(30,Math.min(CH-30,car.y));
  // Basis
  if(Math.hypot(car.x-BASE.x,car.y-BASE.y)<BASE.r&&Math.abs(car.v)<0.3){
    if(car.stash>0){car.ore+=car.stash;say(`Abgeladen: ${car.stash} Brocken.`);car.stash=0;}
    if(car.bat<100){car.bat=Math.min(100,car.bat+0.8);}
  }
  // Einsammeln
  if(car.stash<car.cap) for(let i=chunks.length-1;i>=0;i--){const c=chunks[i]; if(c.rest&&Math.hypot(c.x-car.x,c.y-car.y)<26){chunks.splice(i,1);car.stash++; if(car.stash>=car.cap)say('Stauraum voll. Zurück zur Basis.');}}
}

// ---------------- Arm und Werkzeug
const ARM={L1:46,L2:44,sector:1.15};
const arm={phase:0,tip:{x:0,y:0,z:0},target:null,ok:false,beat:-1};
let hitstop=0, shake=0; const fx=[];
function pivot(){return {x:car.x+Math.cos(car.a)*24,y:car.y+Math.sin(car.a)*24};}
function pickTarget(){
  // nächster Klumpenteil unter dem Cursor (Bildschirmkoordinaten inkl. Höhenversatz)
  let best=null,bd=1e9;
  for(const L of lumps)for(const p of L.parts){ const sy=p.y-p.r*Z; const d=Math.hypot(mouse.x-p.x,mouse.y-sy); if(d<p.r&&d<bd){bd=d;best=p;} }
  return best;
}
function updateArm(){
  const pv=pivot(); const t=pickTarget(); arm.target=t;
  let rest={x:pv.x+Math.cos(car.a)*50,y:pv.y+Math.sin(car.a)*50,z:10};
  arm.ok=false;
  if(t){
    const dx=t.x-pv.x,dy=t.y-pv.y,d=Math.hypot(dx,dy); let da=Math.atan2(dy,dx)-car.a; da=Math.atan2(Math.sin(da),Math.cos(da));
    arm.ok = d<=ARM.L1+ARM.L2-4 && d>=6 && Math.abs(da)<=ARM.sector;
  }
  const working=mouse.down&&arm.ok&&car.bat>0;
  if(working){
    arm.beat++; const ph=(arm.beat%P.beat)/P.beat;
    // ausholen (0..0.6): Spitze weg vom Ziel und hoch; Schlag (0.6..0.7): auf das Ziel; danach kurz ruhen
    let goal;
    if(ph<0.6){const k=ph/0.6; goal={x:t.x+(pv.x-t.x)*0.35*k,y:t.y+(pv.y-t.y)*0.35*k,z:8+22*k};}
    else if(ph<0.72){goal={x:t.x,y:t.y,z:t.r*0.6}; if(arm.beat%P.beat===Math.round(P.beat*0.62)) strike(t);}
    else goal={x:t.x,y:t.y,z:t.r*0.6};
    arm.tip.x+=(goal.x-arm.tip.x)*(ph<0.6?0.25:0.7); arm.tip.y+=(goal.y-arm.tip.y)*(ph<0.6?0.25:0.7); arm.tip.z+=(goal.z-arm.tip.z)*(ph<0.6?0.25:0.7);
  } else {
    arm.beat=-1;
    const goal = (t&&arm.ok)? {x:t.x,y:t.y,z:t.r*0.6+8} : rest;   // zeigt hin, wenn erreichbar
    arm.tip.x+=(goal.x-arm.tip.x)*0.15; arm.tip.y+=(goal.y-arm.tip.y)*0.15; arm.tip.z+=(goal.z-arm.tip.z)*0.15;
  }
  if(mouse.down&&t&&!arm.ok&&car.bat>0&&frame%40===0) say('Nicht in Reichweite. Näher ran oder drehen.');
  if(mouse.down&&car.bat<=0&&frame%60===0) say('Akku leer. Zur Basis.');
}
function strike(t){
  car.bat=Math.max(0,car.bat-1);
  const R=P.rad; let broke=0, clank=false;
  for(const L of lumps){
    for(let i=L.parts.length-1;i>=0;i--){
      const p=L.parts[i]; const d=Math.hypot(p.x-t.x,p.y-t.y); if(d>R+p.r*0.3) continue;
      const fall=1-Math.min(1,d/(R+p.r*0.3));                // Nähe zur Trefferstelle
      const chip=(P.pow-p.bind)*fall;
      if(chip<=0){clank=true; continue;}                       // zu hart: nichts passiert
      const loss=chip*2.2; p.r-=loss; broke+=loss;
      // Splitter fliegen weg von der Trefferstelle
      p.debris=(p.debris||0)+loss; const n=Math.floor(p.debris/5); p.debris-=n*5;
      for(let k=0;k<n;k++){ const a=Math.atan2(p.y-t.y,p.x-t.x)+rnd(-0.9,0.9); const sp=rnd(1.5,4);
        chunks.push({x:p.x+Math.cos(a)*p.r*0.5,y:p.y+Math.sin(a)*p.r*0.5,z:p.r*0.5,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.8,vz:rnd(2,4),r:rnd(3,5.5),rest:false,shade:p.shade}); }
      if(p.r<9){ L.parts.splice(i,1); for(let k=0;k<2;k++){const a=Math.random()*6.28;chunks.push({x:p.x,y:p.y,z:6,vx:Math.cos(a)*2,vy:Math.sin(a)*1.6,vz:3,r:rnd(3,5),rest:false,shade:p.shade});} }
    }
  }
  if(broke>0){hitstop=P.stop;shake=Math.min(6,broke*0.8);}
  else if(clank){shake=1.5; for(let k=0;k<5;k++)fx.push({x:t.x,y:t.y-t.r*Z,vx:rnd(-2,2),vy:rnd(-3,-1),l:12,c:'#ffe9a8'}); if(frame%30<2)say('Zu hart für dieses Werkzeug.');}
  // Staubwolke
  for(let k=0;k<(broke>0?8:2);k++)fx.push({x:t.x+rnd(-8,8),y:t.y-t.r*Z*0.5,vx:rnd(-1,1),vy:rnd(-1.5,-0.3),l:rnd(18,30),c:'rgba(150,120,90,.5)'});
}
function updateChunks(){
  for(const c of chunks){ if(c.rest) continue; c.x+=c.vx;c.y+=c.vy;c.z+=c.vz;c.vz-=0.28; c.vx*=0.98;c.vy*=0.98;
    if(c.z<=0){c.z=0; if(c.vz<-1.2){c.vz*=-0.35;c.vx*=0.6;c.vy*=0.6;} else {c.rest=true;c.vz=0;} } }
  for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.x+=p.vx;p.y+=p.vy;if(--p.l<=0)fx.splice(i,1);}
}

// ---------------- Zeichnen (Schrägsicht: Höhe z hebt nach oben)
function ground(){
  const g=ctx.createLinearGradient(0,0,0,CH); g.addColorStop(0,'#2c2419'); g.addColorStop(1,'#241d14'); ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
  ctx.strokeStyle='rgba(255,230,190,.04)'; ctx.lineWidth=1;
  for(let x=0;x<CW;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CH);ctx.stroke();} for(let y=0;y<CH;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CW,y);ctx.stroke();}
  ctx.fillStyle='#3a3126'; ctx.beginPath(); ctx.ellipse(BASE.x,BASE.y,BASE.r,BASE.r*0.7,0,0,7); ctx.fill();
  ctx.strokeStyle='#8a7355'; ctx.lineWidth=2; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.ellipse(BASE.x,BASE.y,BASE.r,BASE.r*0.7,0,0,7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#8a7d68'; ctx.font='12px Georgia'; ctx.fillText('Basis', BASE.x-16, BASE.y+4);
}
function shadow(x,y,r,z){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x+z*0.15,y+2,r,r*0.6,0,0,7); ctx.fill(); }
function sphere(p,hi){
  const sy=p.y-p.r*Z; const base=p.core? [110,88,70] : [150,105,70];
  const s=p.shade; const g=ctx.createRadialGradient(p.x-p.r*0.35,sy-p.r*0.4,p.r*0.1,p.x,sy,p.r*1.05);
  g.addColorStop(0,`rgb(${base[0]+45+s},${base[1]+40+s},${base[2]+30+s})`); g.addColorStop(0.55,`rgb(${base[0]+s},${base[1]+s},${base[2]+s})`); g.addColorStop(1,`rgb(${base[0]-55+s},${base[1]-45+s},${base[2]-35+s})`);
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(p.x,sy,p.r,p.r*0.92,0,0,7); ctx.fill();
  if(p.core){ctx.strokeStyle='rgba(60,40,30,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(p.x,sy,p.r*0.6,p.r*0.5,0,0,7);ctx.stroke();}
  if(hi){ctx.strokeStyle=arm.ok?'rgba(255,240,200,.9)':'rgba(255,120,90,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,sy,p.r+3,p.r*0.92+3,0,0,7);ctx.stroke();}
}
function drawCar(){
  const {x,y,a}=car; const c=Math.cos(a),s=Math.sin(a);
  const R=(lx,ly)=>({x:x+lx*c-ly*s,y:y+lx*s+ly*c});
  shadow(x,y,26,0);
  const H=14; // Aufbauhöhe
  const box=(x0,y0,x1,y1,col,h)=>{ const pts=[R(x0,y0),R(x1,y0),R(x1,y1),R(x0,y1)]; ctx.fillStyle=col; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y-h*Z):ctx.moveTo(p.x,p.y-h*Z)); ctx.closePath(); ctx.fill(); };
  // Raupen (unten), dunkler
  box(-22,-16,18,-9,'#4a4238',3); box(-22,9,18,16,'#4a4238',3);
  // Seiten des Rumpfs (Höhe), dann Deck
  box(-20,-11,14,11,'#7a6f60',4);
  box(-20,-11,14,11,'#b8ae9c',H);
  // Kabine hinten, höher
  box(-19,-9,-6,9,'#8e8578',H+2); box(-19,-9,-6,9,'#c9c2b4',H+10);
  ctx.fillStyle='#6fb4e0'; const e=R(-8,0); ctx.fillRect(e.x-2,e.y-(H+10)*Z-2,4,4);
  // Arm: Drehpunkt vorn, zwei Glieder zur Spitze (IK), Ellbogen nach oben
  const pv=pivot(); const tip=arm.tip; const pz=H+4;
  const dx=tip.x-pv.x, dy=(tip.y-tip.z*Z)-(pv.y-pz*Z); const d=Math.min(ARM.L1+ARM.L2-1,Math.hypot(dx,dy));
  const ang=Math.atan2(dy,dx); const q=Math.acos(Math.max(-1,Math.min(1,(ARM.L1*ARM.L1+d*d-ARM.L2*ARM.L2)/(2*ARM.L1*d))));
  const ex=pv.x+Math.cos(ang-q)*ARM.L1, ey=(pv.y-pz*Z)+Math.sin(ang-q)*ARM.L1;
  ctx.strokeStyle='#3a3128'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(pv.x,pv.y-pz*Z); ctx.lineTo(ex,ey); ctx.lineTo(tip.x,tip.y-tip.z*Z); ctx.stroke();
  ctx.strokeStyle='#a39c8e'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(pv.x,pv.y-pz*Z); ctx.lineTo(ex,ey); ctx.lineTo(tip.x,tip.y-tip.z*Z); ctx.stroke();
  ctx.fillStyle='#6f6a60'; ctx.beginPath(); ctx.arc(ex,ey,5,0,7); ctx.fill();
  // Hacke an der Spitze
  ctx.fillStyle='#e0dacc'; ctx.beginPath(); ctx.moveTo(tip.x-6,tip.y-tip.z*Z-4); ctx.lineTo(tip.x+8,tip.y-tip.z*Z); ctx.lineTo(tip.x-6,tip.y-tip.z*Z+4); ctx.closePath(); ctx.fill();
  shadow(tip.x,tip.y,5,tip.z);
}
let frame=0;
function loop(){
  frame++;
  if(hitstop>0)hitstop--; else {updateCar();updateArm();}
  updateChunks(); if(sayT>0&&--sayT===0)sayEl.textContent='';
  ctx.save(); if(shake>0){ctx.translate(rnd(-shake,shake),rnd(-shake,shake));shake*=0.8;if(shake<.2)shake=0;}
  ground();
  // Schatten aller Klumpenteile und Brocken
  for(const L of lumps)for(const p of L.parts)shadow(p.x,p.y,p.r*0.95,0);
  for(const c of chunks)shadow(c.x,c.y,c.r,c.z);
  // Objekte nach y sortiert zeichnen
  const items=[];
  for(const L of lumps)for(const p of L.parts)items.push({y:p.y,f:()=>sphere(p,p===arm.target)});
  for(const c of chunks)items.push({y:c.y,f:()=>{ctx.fillStyle=`rgb(${150+c.shade+20|0},${105+c.shade+15|0},${70+c.shade+10|0})`;ctx.beginPath();ctx.ellipse(c.x,c.y-c.z*Z-c.r*0.3,c.r,c.r*0.8,0,0,7);ctx.fill();}});
  items.push({y:car.y,f:drawCar});
  items.sort((a,b)=>a.y-b.y); for(const it of items)it.f();
  for(const p of fx){ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);}
  // Arbeitssektor schwach andeuten
  const pv=pivot(); ctx.strokeStyle='rgba(255,240,200,.07)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(pv.x,pv.y); ctx.arc(pv.x,pv.y,ARM.L1+ARM.L2-4,car.a-ARM.sector,car.a+ARM.sector); ctx.closePath(); ctx.stroke();
  ctx.restore();
  document.getElementById('bat').textContent=Math.ceil(car.bat); document.getElementById('st').textContent=car.stash; document.getElementById('cap').textContent=car.cap; document.getElementById('ore').textContent=car.ore;
  requestAnimationFrame(loop);
}
say('Fünf Klumpen. Der Akku reicht für ungefähr zwei.');
loop();
</script>
</body>
</html>
